<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>答案</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      background: #000;
      color: #8cff80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #000;
    }
    main {
      width: 100%;
      height: 100%;
      padding: max(0.375rem, env(safe-area-inset-top)) max(0.375rem, env(safe-area-inset-right)) max(0.375rem, env(safe-area-inset-bottom)) max(0.375rem, env(safe-area-inset-left));
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #status {
      position: fixed;
      top: max(0.375rem, env(safe-area-inset-top));
      right: max(0.5rem, env(safe-area-inset-right));
      z-index: 1;
      margin: 0;
      color: #b5c8b2;
      font-family: system-ui, sans-serif;
      font-size: 0.875rem;
      line-height: 1.5;
      text-align: right;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }
    #status:empty { display: none; }
    #status.error { color: #ffd166; }
    #answers {
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 0.625rem;
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .answer {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      justify-items: center;
      padding: 0.25rem 0;
      border: 1px solid #285b2b;
      border-radius: 0.5rem;
      background: #071007;
      overflow: hidden;
      font-size: clamp(2.75rem, 13vw, 4.25rem);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .number, .stem, .letter {
      min-width: 0;
      text-align: center;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
    }
    .number { color: #b5c8b2; }
    .number::after { content: "."; }
    .stem {
      color: #b5c8b2;
      white-space: nowrap;
      transform: scaleX(0.78);
    }
    .letter { color: #8cff80; }
    noscript {
      display: block;
      color: #ffd166;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
    }
    @media (min-width: 48rem) {
      #answers { gap: 0.75rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">题目答案</h1>
    <p id="status" role="status" aria-live="polite">正在连接…</p>
    <ol id="answers" aria-label="题号和答案"></ol>
    <noscript>请开启 JavaScript 以自动接收答案。</noscript>
  </main>
  <script>
    const list = document.querySelector("#answers");
    const status = document.querySelector("#status");
    const device = new URLSearchParams(location.search).get("d") || "";
    let rendered = "";
    let refreshing = false;

    function render(items) {
      const signature = JSON.stringify(items);
      if (signature === rendered) return;
      rendered = signature;
      list.replaceChildren();
      const fragment = document.createDocumentFragment();
      for (const item of items) {
        const row = document.createElement("li");
        row.className = "answer";
        row.setAttribute("aria-label", `第${item.no}题，答案${item.answer}`);

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = item.no;
        const stem = document.createElement("span");
        stem.className = "stem";
        stem.textContent = item.prefix || "";
        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = item.answer;
        row.append(number, stem, letter);
        fragment.append(row);
      }
      list.append(fragment);
    }

    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const query = device ? `?d=${encodeURIComponent(device)}` : "";
        const response = await fetch(`/api/display${query}`, {
          cache: "no-store",
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const items = Array.isArray(data.items) ? data.items.filter(item =>
          item && /^[A-H]$/.test(item.answer)
        ) : [];
        render(items.slice(0, 3));
        status.classList.remove("error");
        if (data.pending > 0) {
          status.textContent = `正在整理 ${data.pending} 张照片…`;
        } else if (items.length === 0) {
          status.textContent = "等待照片…";
        } else {
          status.textContent = "";
        }
      } catch (_) {
        status.textContent = "连接中断，自动重试…";
        status.classList.add("error");
      } finally {
        clearTimeout(timeout);
        refreshing = false;
        setTimeout(refresh, 2000);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refresh();
    });
    refresh();
  </script>
</body>
</html>
